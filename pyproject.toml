[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring-mlops"
version = "0.1.0"
description = "Credit Scoring com MLOps: contratos de dados, detecção de drift, observabilidade e governança (Tech Challenge Fase 4)"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "psutil>=6.0",           # CPU e memória por estágio do pipeline (observabilidade)
    "pytest>=8.0",
    "xgboost>=2.0",          # modelo base de risco de crédito
    "pandera>=0.20",         # contratos de qualidade de dados (Data Contracts)
    "evidently>=0.4",        # detecção de Data/Concept Drift + relatórios HTML
    "scipy>=1.13",           # testes estatísticos (KS, PSI auxiliar)
    "ucimlrepo>=0.0.7",
    "mlflow>=2.14",          # rastreamento de experimentos e observabilidade (Etapa 3)
    "fastapi>=0.115",        # API HTTP (src/api/): drift e execução do pipeline
    "uvicorn>=0.30",         # servidor ASGI da API
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]
data = [
    "ucimlrepo>=0.0.7",      # recuperar target original do German Credit (UCI id=144)
]

#[tool.uv]
# Somente macOS (dev) e Linux (Docker) são suportados; Windows não.
#environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# Índice público fixo para o uv.lock ser portável (time e Docker),
# independente de mirrors configurados na máquina de quem roda `uv lock`.
#[[tool.uv.index]]
#url = "https://pypi.org/simple"
#default = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "httpx>=0.27",           # TestClient do FastAPI nos testes da API
]
